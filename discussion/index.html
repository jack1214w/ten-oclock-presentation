<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>失敗討論區</title>
<style>
:root{
  --bg:#FBF7F0; --card:#FFFFFF; --ink:#2B2638; --dim:#6B6580; --line:#E6DFD3;
  --accent:#C8862A; --accent-soft:#F6E7CF; --a:#3D7DCA; --b:#2E9E6E; --c:#B5579A;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
.screen{display:none}.screen.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--dim);font-size:.95rem}
.crumbs{flex:1;display:flex;gap:6px;flex-wrap:wrap}
.crumb{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.85rem}
.crumb.now{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.tag{display:inline-block;color:var(--accent);font-weight:700;letter-spacing:.15em;font-size:.95rem}
.ctx{margin-top:18px;color:var(--dim);font-size:1.15rem}
h1{font-family:var(--serif);font-size:2.3rem;line-height:1.45;margin:8px 0 6px}
.big-title{font-family:var(--serif);font-size:3rem;margin:10px 0}
.opts{display:grid;gap:14px;margin-top:22px}
.opt{display:flex;align-items:center;gap:16px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 18px}
.letter{flex:0 0 52px;height:52px;border-radius:12px;color:#fff;font-weight:800;font-size:1.6rem;display:flex;align-items:center;justify-content:center}
.L0{background:var(--a)}.L1{background:var(--b)}.L2{background:var(--c)}
.otext{flex:1;font-size:1.45rem;font-weight:600}
.counter{display:flex;align-items:center;gap:6px}
.counter button{font:inherit;width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:1.5rem;cursor:pointer;color:var(--ink)}
.counter button:hover{border-color:var(--accent)}
.counter input{width:70px;height:46px;text-align:center;font:inherit;font-size:1.5rem;font-weight:700;border:1px solid var(--line);border-radius:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:24px}
.row.center{justify-content:center}
.btn{font:inherit;font-weight:700;font-size:1.15rem;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:12px 30px;cursor:pointer}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
.btn.small{font-size:.95rem;padding:7px 16px}
.total{color:var(--dim);font-size:1.05rem}
.tip{margin-top:26px;border:1px dashed var(--line);border-radius:12px;background:#fff8}
.tip summary{cursor:pointer;padding:10px 16px;color:var(--dim);font-size:.95rem}
.tip div{padding:0 16px 12px;color:var(--dim)}
/* result */
.res{display:grid;gap:12px;margin-top:22px}
.bar{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 16px}
.bar.win{border-color:var(--accent);box-shadow:0 4px 18px rgba(200,134,42,.18)}
.bar .head{display:flex;align-items:center;gap:12px}
.bar .letter{flex-basis:40px;height:40px;font-size:1.2rem}
.bar .otext{font-size:1.25rem}
.bar .num{font-weight:800;font-size:1.3rem;white-space:nowrap}
.track{height:14px;background:#F0EAE0;border-radius:99px;margin-top:10px;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .8s ease}
.F0{background:var(--a)}.F1{background:var(--b)}.F2{background:var(--c)}
.ask{margin-top:10px;font-size:1.15rem;padding-left:14px;border-left:3px solid var(--accent)}
.bar:not(.win) .ask{font-size:1rem;color:var(--dim);border-left-color:var(--line)}
.notice{margin-top:18px;background:var(--accent-soft);border-radius:12px;padding:12px 16px;font-size:1.1rem}
.alt{margin-top:14px;color:var(--dim);font-size:.95rem;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* intro & end */
.intro p{font-size:1.2rem;color:var(--dim);max-width:780px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.rule{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.rule b{display:block;font-size:1.1rem;margin-bottom:4px}
.path{display:grid;gap:12px;margin-top:20px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.step .q{font-weight:700;font-size:1.1rem}
.step .meta{color:var(--dim);font-size:.95rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{border-radius:8px;padding:2px 10px;font-size:.95rem;background:#F3EEE6}
.chip.win{background:var(--accent-soft);font-weight:700}
.card-act{margin-top:24px;background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:20px}
.card-act .fill-line{font-family:var(--serif);font-size:1.6rem;margin:10px 0}
.ver{text-align:center;color:#B0A99B;font-size:.75rem;margin-top:40px}
#errbar{display:none;position:fixed;left:0;right:0;top:0;background:#a33;color:#fff;padding:8px 14px;z-index:99}
@media (max-width:700px){
  h1{font-size:1.6rem}.big-title{font-size:2rem}
  .otext{font-size:1.1rem}.opt{flex-wrap:wrap}
  .rules{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="errbar"></div>
<div class="wrap">

<div class="screen on" id="s-intro">
  <div class="intro">
    <span class="tag">《十點的發表會》之後</span>
    <div class="big-title">失敗討論區</div>
    <p>每一題由全班一起選。老師數完舉手的人數後，<b>大部分人選的方向</b>會決定下一個問題是什麼——所以每個班級走出來的討論，都不一樣。</p>
    <div class="rules">
      <div class="rule"><b>沒有標準答案</b>每個選項都是真的有人會這樣想的想法。</div>
      <div class="rule"><b>選你真的這樣想的</b>不是選「老師可能想聽的」。</div>
      <div class="rule"><b>少數也很重要</b>選比較少人選的同學，常常有最特別的理由。</div>
    </div>
    <div class="row"><button class="btn" onclick="start()">開始討論</button></div>
  </div>
</div>

<div class="screen" id="s-vote"><div id="vote"></div></div>
<div class="screen" id="s-result"><div id="result"></div></div>
<div class="screen" id="s-end"><div id="end"></div></div>

<div class="ver">失敗討論區 v1.0　·　搭配《十點的發表會》使用</div>
</div>

<script>
window.onerror = function(msg, src, line){
  var b = document.getElementById("errbar");
  b.style.display = "block";
  b.textContent = "⚠️ 程式發生錯誤（v1.0）：" + msg + "（第 " + line + " 行）";
};

/* ═══════════ 討論樹 ═══════════
   每一題三個選項；ask = 揭曉後，對選這個選項的同學追問的話
   next = 這個選項是多數時，下一題要去哪裡 */
const NODES = {
  start:{tag:"第一站 · 回到那個早上", ctx:"玩完《十點的發表會》，回想主角第一次上台的樣子。",
    q:"你覺得主角第一次上台搞砸，最大的原因是什麼？",
    tip:"暖身題，三個方向都合理。重點是讓學生說出「為什麼這樣覺得」，可請少數選項的同學先說。",
    o:[
      {t:"準備得不夠", ask:"你覺得主角少準備了哪一樣？如果是你，會先準備什麼？", next:"prep"},
      {t:"太在意別人怎麼看", ask:"遊戲裡哪一個時刻，讓你覺得主角很在意別人的眼光？", next:"eyes"},
      {t:"想要完美，什麼都自己來", ask:"從哪裡看得出主角想要完美？你有過類似的時候嗎？", next:"perfect"}]},

  prep:{tag:"第二站 · 準備", ctx:"主角在第二輪把五個問題都處理好，就成功了。",
    q:"如果準備得夠多，就一定不會失敗嗎？",
    tip:"這題在區分「可控」和「不可控」。選「會」的學生不是錯，可以追問：有沒有準備了還是出錯的經驗？",
    o:[
      {t:"會，只要夠努力就不會失敗", ask:"你有沒有很努力準備，結果還是出了狀況的經驗？那時候是什麼原因？", next:"control"},
      {t:"不一定，有些事情控制不了", ask:"遊戲裡哪些事是主角控制不了的？現實生活中呢？", next:"control"},
      {t:"就算失敗，準備的過程也不會白費", ask:"主角重來那麼多次，哪一次的「白費」其實有用？", next:"value"}]},

  eyes:{tag:"第二站 · 別人的眼光", ctx:"主角聽到後排有人小聲說：「資優班的也不過這樣。」",
    q:"上台的時候，你最怕台下的人怎麼想你？",
    tip:"這題可能觸及學生真實的壓力來源。分享採自願，老師可以先說自己的例子。",
    o:[
      {t:"覺得我很笨、講得很爛", ask:"你覺得台下的人真的會記得你講錯的地方嗎？", next:"spotlight"},
      {t:"覺得「資優生也不過如此」", ask:"這句話如果真的被說出來，你心裡會是什麼感覺？", next:"label"},
      {t:"比較怕讓爸媽或老師失望", ask:"你覺得他們最在意的，是結果，還是別的東西？", next:"label"}]},

  perfect:{tag:"第二站 · 完美", ctx:"主角把小米負責的結論整頁重做，小米上台時一句話都沒說。",
    q:"主角把小米的部分重做的時候，心裡可能在想什麼？",
    tip:"引導學生看見「控制」背後常常是焦慮。也可以請學生想想自己當過主角還是小米。",
    o:[
      {t:"怕小米做不好，害整組丟臉", ask:"如果小米真的做得不夠好，還有什麼別的辦法？", next:"team"},
      {t:"覺得只有自己做的才夠好", ask:"這個想法從哪裡來？它幫了主角，還是害了主角？", next:"team"},
      {t:"太緊張了，想抓住能控制的東西", ask:"你緊張的時候，會想抓住什麼？", next:"control"}]},

  control:{tag:"第三站 · 能改變的事", ctx:"音響、評審的問題、別人的笑聲——有些事我們管不了。",
    q:"一件事失敗之後，下面哪一件是你最能改變的？",
    tip:"三個選項都在可控範圍內，差別在於學生習慣把力氣放在哪裡：行動、想法，還是堅持。",
    o:[
      {t:"下一次怎麼準備", ask:"你會怎麼找出「下一次要準備什麼」？像主角查情報那樣嗎？", next:"act"},
      {t:"我怎麼看待這次失敗", ask:"同一次失敗，可以有哪兩種不同的看法？", next:"talk"},
      {t:"要不要再試一次", ask:"什麼情況下你會決定再試？什麼情況下你會先停下來？", next:"talk"}]},

  spotlight:{tag:"第三站 · 聚光燈", ctx:"結局裡，爸媽和阿凱都不記得那張打不開的投影片。",
    q:"你還記得上一次同學上台報告時，出了什麼小錯嗎？",
    tip:"聚光燈效應：我們以為別人一直盯著自己的錯，其實別人大多沒注意。若多數人「完全不記得」，正好可以點出這件事。",
    o:[
      {t:"記得很清楚", ask:"你記得那個錯，會讓你覺得那位同學很差嗎？", next:"talk"},
      {t:"有一點印象，但細節忘了", ask:"那你覺得別人會記得你的小錯多久？", next:"talk"},
      {t:"完全不記得", ask:"如果別人也不記得你的錯，那你上台前最需要擔心的是什麼？", next:"act"}]},

  label:{tag:"第三站 · 資優生這三個字", ctx:"主角心裡一直轉著：「如果我不是最好的，那我還是資優生嗎？」",
    q:"「資優生」這三個字，對你來說比較像什麼？",
    tip:"本討論最敏感的一題。三個比喻都接受，不要評價哪一個比較好；可請學生自己再想第四種比喻。",
    o:[
      {t:"一張獎狀：證明我很厲害", ask:"如果有一天沒有這張獎狀，你覺得自己會少了什麼？", next:"talk"},
      {t:"一個背包：背起來很重", ask:"這個背包裡裝了什麼？有沒有哪一樣可以先放下？", next:"talk"},
      {t:"一個名牌：不太代表我是誰", ask:"那你覺得，真正代表你的是什麼？", next:"act"}]},

  team:{tag:"第三站 · 一起做", ctx:"小米說：「反正我做的你都會改掉，那我做了幹嘛？」",
    q:"如果你是主角，你會怎麼對小米說？",
    tip:"可以請學生兩兩角色扮演，一個當主角、一個當小米，說完再交換。",
    o:[
      {t:"「結論交給你，我不改。」", ask:"說出這句話，對主角來說難在哪裡？", next:"act"},
      {t:"「我們一起改，好不好？」", ask:"「一起改」和「我幫你改」差在哪裡？", next:"act"},
      {t:"我不知道怎麼開口", ask:"你覺得卡住的是哪一部分？是怕尷尬，還是怕結果變差？", next:"talk"}]},

  value:{tag:"第三站 · 不完美的數據", ctx:"主角把那筆被刪掉的「怪數據」放回圖表，標上問號。",
    q:"你覺得主角這樣做……",
    tip:"連結到科學精神：異常值常常是新發現的起點。選「我做不到」的學生很誠實，值得肯定。",
    o:[
      {t:"很勇敢，因為大家會看到不完美", ask:"你覺得「勇敢」和「不害怕」一樣嗎？", next:"talk"},
      {t:"很聰明，評審反而會加分", ask:"如果評審不會加分，你還會把它放回去嗎？為什麼？", next:"act"},
      {t:"老實說，我自己可能做不到", ask:"是什麼讓你覺得做不到？如果要做到，需要什麼幫忙？", next:"talk"}]},

  talk:{tag:"第四站 · 對自己說的話", ctx:"遊戲裡，每次下課鐘響，主角心裡都會出現一個聲音。",
    q:"失敗後，腦中出現「我果然不行」的聲音時，你可以怎麼回答它？",
    tip:"三個回答都是健康的回應：往前找問題、承認感受、先暫停。也可以請學生寫下自己的版本。",
    o:[
      {t:"「我只是還沒找到問題在哪。」", ask:"這句話什麼時候最難說出口？", next:"end"},
      {t:"「我現在很難過，這也沒關係。」", ask:"為什麼承認難過，反而會讓人比較好過？", next:"end"},
      {t:"「我先休息一下，等一下再想。」", ask:"你的「休息一下」通常是做什麼？", next:"end"}]},

  act:{tag:"第四站 · 下一次", ctx:"主角重來了好幾次，每一次都比上一次多知道一點。",
    q:"下一次面對一件可能會失敗的事，你最想先做哪一件？",
    tip:"把討論拉回學生真實生活：最近有沒有一件快要面對的事（比賽、報告、考試）？",
    o:[
      {t:"先找出可能出事的地方", ask:"你最近有哪一件事，可以先「查情報」？", next:"end"},
      {t:"找人一起做，不要全部自己扛", ask:"你身邊有誰，是你可以放心交給他的？", next:"end"},
      {t:"先照顧好自己的心情", ask:"你的「輔導室懶骨頭」是什麼？什麼事能讓你平靜下來？", next:"end"}]}
};
const LETTERS = ["A","B","C"];

/* ═══════════ 狀態 ═══════════ */
const S = {cur:"start", counts:[0,0,0], path:[]};
function $(id){ return document.getElementById(id); }
function go(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); $(id).classList.add("on"); window.scrollTo({top:0}); }

function crumbs(){
  const done = S.path.map(p=>`<span class="crumb">${NODES[p.id].tag.split(" · ")[1]}</span>`).join("");
  const now = S.cur!=="end" ? `<span class="crumb now">${NODES[S.cur].tag.split(" · ")[1]}</span>` : "";
  return `<div class="top"><div class="crumbs">${done}${now}</div>
    ${S.path.length?`<button class="btn ghost small" onclick="back()">← 上一題</button>`:""}</div>`;
}

function start(){ S.cur="start"; S.path=[]; S.counts=[0,0,0]; renderVote(); }

function renderVote(){
  const n = NODES[S.cur];
  $("vote").innerHTML = `${crumbs()}
    <div class="ctx">${n.ctx}</div>
    <span class="tag" style="margin-top:14px;">${n.tag}</span>
    <h1>${n.q}</h1>
    <div class="opts">${n.o.map((o,i)=>`
      <div class="opt"><div class="letter L${i}">${LETTERS[i]}</div><div class="otext">${o.t}</div>
        <div class="counter"><button onclick="bump(${i},-1)" aria-label="減一">−</button>
          <input type="number" min="0" id="c${i}" value="${S.counts[i]}" oninput="setCount(${i},this.value)" aria-label="${LETTERS[i]} 的人數">
          <button onclick="bump(${i},1)" aria-label="加一">＋</button></div></div>`).join("")}</div>
    <div class="row"><button class="btn" id="reveal" onclick="reveal()">揭曉結果</button>
      <span class="total" id="total"></span></div>
    <details class="tip"><summary>教師提示（點開）</summary><div>${n.tip}</div></details>`;
  updateTotal();
  go("s-vote");
}
function bump(i,d){ S.counts[i]=Math.max(0,S.counts[i]+d); $("c"+i).value=S.counts[i]; updateTotal(); }
function setCount(i,v){ S.counts[i]=Math.max(0,parseInt(v,10)||0); updateTotal(); }
function updateTotal(){
  const t = S.counts.reduce((a,b)=>a+b,0);
  $("total").textContent = t ? `目前共 ${t} 票` : "請輸入各選項舉手的人數";
  $("reveal").disabled = t===0;
}

function reveal(){
  const n = NODES[S.cur], c = S.counts.slice(), t = c.reduce((a,b)=>a+b,0);
  const max = Math.max(...c), winners = c.map((v,i)=>v===max?i:-1).filter(i=>i>=0);
  const tie = winners.length>1;
  $("result").innerHTML = `${crumbs()}
    <span class="tag" style="margin-top:14px;">${n.tag}</span>
    <h1>${n.q}</h1>
    <div class="res">${n.o.map((o,i)=>{
      const pct = t? Math.round(c[i]/t*100):0, win = winners.includes(i);
      return `<div class="bar ${win?"win":""}"><div class="head"><div class="letter L${i}">${LETTERS[i]}</div>
        <div class="otext">${o.t}</div><div class="num">${c[i]} 人 · ${pct}%</div></div>
        <div class="track"><div class="fill F${i}" style="width:0" data-w="${pct}"></div></div>
        ${c[i]>0?`<div class="ask">${win?"想問選這個的同學：":"也想聽聽選 "+LETTERS[i]+" 的同學："}${o.ask}</div>`:""}</div>`;
    }).join("")}</div>
    ${tie
      ? `<div class="notice">平手了！請大家說說理由，再由老師決定要往哪個方向討論。</div>
         <div class="row">${winners.map(i=>`<button class="btn" onclick="next(${i},true)">往 ${LETTERS[i]} 的方向</button>`).join("")}</div>`
      : `<div class="row"><button class="btn" onclick="next(${winners[0]},false)">往下討論 →</button></div>
         <div class="alt">想改走別的方向？${n.o.map((o,i)=>i===winners[0]?"":`<button class="btn ghost small" onclick="next(${i},true)">改走 ${LETTERS[i]}</button>`).join("")}</div>`}`;
  go("s-result");
  requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll(".fill").forEach(f=>f.style.width=f.dataset.w+"%"),60));
}

function next(i, teacherPick){
  S.path.push({id:S.cur, counts:S.counts.slice(), pick:i, teacherPick:teacherPick});
  S.cur = NODES[S.cur].o[i].next;
  S.counts = [0,0,0];
  if(S.cur==="end") renderEnd(); else renderVote();
}
function back(){
  const last = S.path.pop();
  if(!last) return;
  S.cur = last.id; S.counts = last.counts;
  renderVote();
}

function renderEnd(){
  $("end").innerHTML = `${crumbs()}
    <span class="tag" style="margin-top:14px;">終點 · 我們這一班走過的路</span>
    <h1>今天全班一起走過了 ${S.path.length} 個問題</h1>
    <p style="color:var(--dim);font-size:1.1rem;">別班可能走了完全不同的路。沒有哪一條比較對——每一條，都是一種面對失敗的方式。</p>
    <div class="path">${S.path.map((p,k)=>{
      const n = NODES[p.id], t = p.counts.reduce((a,b)=>a+b,0);
      return `<div class="step"><div class="meta">${k+1}．${n.tag.split(" · ")[1]}${p.teacherPick?"（老師選擇方向）":""}</div>
        <div class="q">${n.q}</div>
        <div class="chips">${n.o.map((o,i)=>`<span class="chip ${i===p.pick?"win":""}">${LETTERS[i]}　${o.t}　${p.counts[i]} 人${t?"（"+Math.round(p.counts[i]/t*100)+"%）":""}</span>`).join("")}</div></div>`;
    }).join("")}</div>
    <div class="card-act">
      <span class="tag">最後一件事 · 寫在卡片上</span>
      <div class="fill-line">下一次失敗的時候，我想對自己說：________</div>
      <p style="color:var(--dim);margin:0;">不用署名。寫完貼在白板上，看看大家寫了什麼。</p>
    </div>
    <div class="row"><button class="btn ghost" onclick="back()">← 回到上一題</button>
      <button class="btn ghost" onclick="start()">重新開始（換一班）</button></div>`;
  go("s-end");
}

/* 鍵盤：投影時方便用 */
document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT") return;
  if(!$("s-vote").classList.contains("on")) return;
  const k = e.key.toLowerCase();
  if(k==="a"||k==="1") bump(0,1);
  if(k==="b"||k==="2") bump(1,1);
  if(k==="c"||k==="3") bump(2,1);
  if(k==="enter" && !$("reveal").disabled) reveal();
});
</script>
</body>
</html>
