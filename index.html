<title>十點的發表會</title>
<style>
body{margin:0;background:#FBF7F0;color:#2B2638;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding:40px 16px}

p{color:#6B6580}

<body>
<div class="wrap">
  <h1>十點的發表會</h1>
  <p>給國小資優生的情意課：用一個時間循環的故事，談失敗、完美主義與「資優生」這個標籤。</p>
  <div class="cards">
    <a class="card" href="game/"><b>① 遊戲：十點的發表會</b><br><span>學生個人或兩人一組遊玩，約 15 分鐘。</span></a>
    <a class="card" href="discussion/"><b>② 失敗討論區</b><br><span>老師投影帶領全班討論，依多數選擇延伸不同問題，約 20 分鐘。</span></a>
    <a class="card" href="chapter2/"><b>③ 第二章：三點的紙橋</b><br><span>談「不敢努力」：拖延、比較、不敢求助。建議先玩過第一章，約 20 分鐘。</span></a>
    <a class="card" href="discussion2/"><b>④ 失敗討論區・第二章</b><br><span>搭配第二章，老師投影帶領全班討論天分、比較、求助與「第四名算不算成功」，約 20 分鐘。</span></a>
  </div>
  <div class="small">遊戲機制靈感來自「失敗博物館」《十一點的鐘聲》，經原作者授權改編。</div>
</div>
</body>
